name: CI

on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run ruff linter
        run: ruff check .
      - name: Run ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          pytest -v --tb=short
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false

  deployment:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate setup script
        run: |
          bash -n setup.sh
          shellcheck setup.sh
      - name: Verify systemd unit
        run: |
          sudo useradd --system --home-dir /nonexistent --no-create-home --shell /usr/sbin/nologin --user-group tsd
          sudo install -d /opt/telegram-server-dash/current/.venv/bin
          sudo install -d /etc/telegram-server-dash /var/lib/telegram-server-dash
          sudo install -m 0755 /bin/true /opt/telegram-server-dash/current/.venv/bin/python
          sudo install -m 0600 /dev/null /etc/telegram-server-dash/telegram-server-dash.env
          sudo systemd-analyze verify deploy/telegram-server-dash.service
