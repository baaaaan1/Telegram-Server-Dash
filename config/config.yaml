# Telegram Server Dash - Configuration
# Bot will look for .env for sensitive values

servers:
  - name: localhost-test
    group: test
    description: "Local test server via subprocess (for development)"
    enabled: true
    transport: local
    monitor_interval: 30

monitoring:
  sample_interval: 30
  retention_hours: 168

alerts:
  cpu_threshold: 90
  ram_threshold: 85
  disk_threshold: 80
  disk_warning_percent: 70
  swap_warning_percent: 50
